<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0507" />
    <meta name="description" content="TOFO Games — play, compete, own the game. Squad up with friends and jump into epic battles." />
    <title>TOFO Games</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/archivo-black.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
    <!-- Shown by CSS only when: in-game + touch device + portrait.
         On Android orientation-lock keeps this from ever appearing;
         on iOS (no lock API) it asks the player to physically rotate. -->
    <div id="rotate-overlay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="7" y="3" width="10" height="18" rx="2" />
        <path d="M21.5 8.5a10 10 0 0 0-4-4.6" />
        <path d="m21.5 4.6 0 3.9-3.9 0" />
        <path d="M2.5 15.5a10 10 0 0 0 4 4.6" />
        <path d="m2.5 19.4 0-3.9 3.9 0" />
      </svg>
      <div class="ro-title">Rotate your device</div>
      <p class="ro-note">The battlefield is best in landscape. If nothing happens, turn off your phone's rotation lock — or tap here to retry fullscreen.</p>
    </div>
    <div id="audio-root" style="display: none"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
